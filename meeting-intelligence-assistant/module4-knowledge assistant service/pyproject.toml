[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-kas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core==0.14.25",
    "llama-index-embeddings-ollama==0.10.0",
    "llama-index-vector-stores-postgres==0.9.0",
    "psycopg[binary]==3.3.5",
    "asyncpg==0.32.0",
    "pgvector==0.5.1",
]
